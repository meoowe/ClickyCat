name: 🚀 Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.8-dev4"
  GODOT_DIR: "${{ github.workspace }}/godot"
  GODOT_BIN: "${{ github.workspace }}/godot/godot"
  EXPORT_TEMPLATES_DIR: "${{ github.workspace }}/godot/export_templates/4.8.dev4"

jobs:

  # ============================================================
  # 🔍 STATIC CHECK
  # ============================================================

  static-check:
    name: 🔍 Static Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔎 Check required files
        run: |
          test -f project.godot
          test -f scenes/global.tscn

      - name: 🏷️ Extract VERSION
        id: version
        run: |
          VERSION=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' scenes/global.tscn)

          if [ -z "$VERSION" ]; then
            echo "❌ VERSION could not be found"
            exit 1
          fi

          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📋 Validate export presets
        run: |
          grep -q 'Linux' export_presets.cfg
          grep -q 'Windows Desktop' export_presets.cfg
          grep -q 'Web' export_presets.cfg

      - name: 🧹 Check repository state
        run: |
          git status --short

      - name: 📤 Save version
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: |
            version.txt

  # ============================================================
  # ⚙️ SETUP
  # ============================================================

  setup:
    name: ⚙️ Setup Godot
    runs-on: ubuntu-latest
    needs: static-check

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create Godot directories
        run: |
          mkdir -p "$GODOT_DIR"
          mkdir -p "$EXPORT_TEMPLATES_DIR"

      - name: ⬇️ Download Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q \
            "https://downloads.godotengine.org/4.8-dev4/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -O godot.zip

      - name: 📦 Extract Godot
        run: |
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip -d "$GODOT_DIR"

          mv "$GODOT_DIR"/Godot_v${GODOT_VERSION}_linux.x86_64 \
             "$GODOT_BIN"

          chmod +x "$GODOT_BIN"

      - name: ⬇️ Download export templates
        run: |
          wget -q \
            "https://downloads.godotengine.org/4.8-dev4/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -O templates.tpz

      - name: 📦 Extract export templates
        run: |
          unzip -q templates.tpz -d templates

          mkdir -p "$EXPORT_TEMPLATES_DIR"

          cp -r templates/templates/* "$EXPORT_TEMPLATES_DIR/"

      - name: 🧪 Verify Godot
        run: |
          "$GODOT_BIN" --version

      - name: 📤 Upload Godot
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ env.GODOT_VERSION }}
          path: godot/

  # ============================================================
  # 🐧 LINUX
  # ============================================================

  export-linux:
    name: 🐧 Export Linux
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Godot
        uses: actions/download-artifact@v4
        with:
          name: godot-${{ env.GODOT_VERSION }}
          path: godot/

      - name: 🔐 Make Godot executable
        run: chmod +x "$GODOT_BIN"

      - name: 📁 Create export directory
        run: mkdir -p build/linux

      - name: 🎮 Export Linux
        run: |
          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-release "Linux/X11" \
            build/linux/game.x86_64

      - name: 📋 List exported files
        run: find build/linux -type f -print

      - name: 📤 Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/

  # ============================================================
  # 🪟 WINDOWS
  # ============================================================

  export-windows:
    name: 🪟 Export Windows
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Godot
        uses: actions/download-artifact@v4
        with:
          name: godot-${{ env.GODOT_VERSION }}
          path: godot/

      - name: 🔐 Make Godot executable
        run: chmod +x "$GODOT_BIN"

      - name: 📁 Create export directory
        run: mkdir -p build/windows

      - name: 🎮 Export Windows
        run: |
          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-release "Windows Desktop" \
            build/windows/game.exe

      - name: 📋 List exported files
        run: find build/windows -type f -print

      - name: 📤 Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/

  # ============================================================
  # 🌐 WEB
  # ============================================================

  export-web:
    name: 🌐 Export Web
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Godot
        uses: actions/download-artifact@v4
        with:
          name: godot-${{ env.GODOT_VERSION }}
          path: godot/

      - name: 🔐 Make Godot executable
        run: chmod +x "$GODOT_BIN"

      - name: 📁 Create export directory
        run: mkdir -p build/web

      - name: 🎮 Export Web
        run: |
          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/index.html

      - name: 📋 List exported files
        run: find build/web -type f -print

      - name: 📤 Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/

  # ============================================================
  # 📦 PACKAGE
  # ============================================================

  package:
    name: 📦 Package Builds
    runs-on: ubuntu-latest
    needs:
      - export-linux
      - export-windows
      - export-web

    steps:
      - name: 📥 Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: builds/linux

      - name: 📥 Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: builds/windows

      - name: 📥 Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: builds/web

      - name: 🏷️ Extract VERSION
        id: version
        run: |
          git clone --depth 1 \
            "https://github.com/${{ github.repository }}.git" \
            source

          VERSION=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' \
            source/scenes/global.tscn)

          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🐧 Package Linux
        run: |
          cd builds/linux
          zip -r ../../game-linux.zip .

      - name: 🪟 Package Windows
        run: |
          cd builds/windows
          zip -r ../../game-windows.zip .

      - name: 🌐 Package Web
        run: |
          cd builds/web
          zip -r ../../game-web.zip .

      - name: 📤 Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            game-linux.zip
            game-windows.zip
            game-web.zip

  # ============================================================
  # 🚀 RELEASE
  # ============================================================

  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: 📥 Download packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages

      - name: 🏷️ Extract VERSION
        id: version
        run: |
          git clone --depth 1 \
            "https://github.com/${{ github.repository }}.git" \
            source

          VERSION=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' \
            source/scenes/global.tscn)

          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            game-linux.zip
            game-windows.zip
            game-web.zip
